<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน | ลอยกระทงเขาย้อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff7de;font-family:Sarabun,sans-serif;background:radial-gradient(ellipse at 80% 0,#37447e,transparent 45%),linear-gradient(145deg,#091027,#101940)}main{width:min(1000px,92vw);margin:0 auto;padding:38px 0 64px}h1,h2,h3,button{font-family:Kanit,sans-serif}h1{font-size:clamp(1.8rem,4vw,2.7rem);margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}header a{color:#ffda80;text-decoration:none}.card{background:#19244ee8;border:1px solid #ffcf5450;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 18px 44px #0004}.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #ffffff3d;background:#0b1432;color:white;font:1rem Sarabun;margin:6px 0 12px}button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}.primary{background:linear-gradient(#ffe58a,#f7ae2a);color:#321c00}.danger{background:#b63f56;color:white}.soft{background:#ffffff18;color:#fff7de;border:1px solid #ffffff35}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice{color:#ffcc71;min-height:1.5em}.sub-list{display:grid;gap:12px}.sub{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;background:#0c1532;border:1px solid #ffffff18;border-radius:13px;padding:10px}.sub img{width:92px;height:92px;object-fit:cover;border-radius:10px}.sub strong{font:500 1.1rem Kanit}.sub small{display:block;color:#adb9d8;margin-top:4px}.hidden{display:none!important}.muted{color:#b7c3df}@media(max-width:600px){.sub{grid-template-columns:66px 1fr;}.sub img{width:66px;height:66px}.sub button{grid-column:2;justify-self:start}}
</style>
</head>
<body><main>
<header><div><h1>หลังบ้านลอยกระทงเขาย้อย</h1><p class="muted">จัดการกระทงนักเรียน · เข้ารหัสข้อมูลที่จัดเก็บ</p></div><a href="/">← กลับหน้าจัดแสดง</a></header>
<section id="login-card" class="card"><h2>เข้าสู่ระบบผู้ดูแล</h2><form id="login-form"><label for="login-password">รหัสผ่าน</label><input class="field" id="login-password" type="password" autocomplete="current-password" required><button class="primary">เข้าสู่ระบบ</button></form><p id="login-message" class="notice" role="status"></p></section>
<section id="dashboard" class="hidden">
<div class="card"><div class="row"><h2 style="margin:0">กระทงที่ส่งเข้ามา</h2><button id="refresh" class="soft">รีเฟรช</button><button id="logout" class="soft">ออกจากระบบ</button></div><p id="count" class="muted"></p><div id="submissions" class="sub-list"></div><p id="empty" class="muted hidden">ยังไม่มีกระทงในระบบ</p><p id="list-message" class="notice" role="status"></p></div>
<div class="card"><h2>ตั้งรหัสผ่านผู้ดูแล</h2><p class="muted">กำหนดหรือเปลี่ยนรหัสผ่านได้ที่ Vercel → Project → Settings → Environment Variables โดยแก้ค่า <code>ADMIN_PASSWORD</code> แล้ว Deploy ใหม่</p></div>
</section></main>
<script>
const $=id=>document.getElementById(id);const loginCard=$('login-card'),dashboard=$('dashboard');
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'ทำรายการไม่สำเร็จ');return data}
function showDashboard(){loginCard.classList.add('hidden');dashboard.classList.remove('hidden');loadItems()}
async function loadItems(){const list=$('submissions');list.replaceChildren();try{const items=await api('/api/admin/submissions');$('count').textContent=`ทั้งหมด ${items.length} กระทง`;$('empty').classList.toggle('hidden',items.length>0);for(const item of items){const row=document.createElement('article');row.className='sub';const image=document.createElement('img');image.src=item.image;image.alt='ภาพกระทง '+item.name;const info=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name;const date=document.createElement('small');date.textContent=new Date(item.createdAt).toLocaleString('th-TH');info.append(name,date);const del=document.createElement('button');del.className='danger';del.textContent='ลบกระทง';del.addEventListener('click',async()=>{if(!confirm(`ยืนยันลบกระทง “${item.name}” หรือไม่`))return;try{await api('/api/admin/submission/'+encodeURIComponent(item.id),{method:'DELETE'});$('list-message').textContent='ลบกระทงแล้ว';loadItems()}catch(e){$('list-message').textContent=e.message}});row.append(image,info,del);list.append(row)}}catch(e){if(e.message.includes('เข้าสู่ระบบ')){loginCard.classList.remove('hidden');dashboard.classList.add('hidden')}else $('list-message').textContent=e.message}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-message').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('login-password').value})});$('login-password').value='';showDashboard()}catch(error){$('login-message').textContent=error.message}});
$('refresh').addEventListener('click',loadItems);$('logout').addEventListener('click',async()=>{await api('/api/admin/logout',{method:'POST'});dashboard.classList.add('hidden');loginCard.classList.remove('hidden')});
api('/api/admin/submissions').then(showDashboard).catch(()=>{});
</script></body></html>
